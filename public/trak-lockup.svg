<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 324 128" role="img" aria-label="trakkit">
  <!-- Mark plus wordmark. The rule under the word and the dot at its end are
       the same track the app's own wordmark draws in CSS (App.css,
       .brand-wordmark) — the name is "trakkit" and the underline is the track,
       so the logo should not invent a different idea.
       The word is live text, not outlines: it renders with the same system
       stack the app uses. For print or anywhere the font is not guaranteed,
       convert the text to paths first. -->
  <rect width="128" height="128" rx="28" fill="#071013"/>
  <g transform="rotate(-11 52.5 60)">
    <rect x="45" y="19" width="15" height="41" rx="7.5" fill="#F6F1E7"/>
    <rect x="49" y="25" width="7" height="28" rx="3.5" fill="#F0B3AC"/>
  </g>
  <g transform="rotate(11 75.5 60)">
    <rect x="68" y="19" width="15" height="41" rx="7.5" fill="#F6F1E7"/>
    <rect x="72" y="25" width="7" height="28" rx="3.5" fill="#F0B3AC"/>
  </g>
  <circle cx="64" cy="76" r="30" fill="#F6F1E7"/>
  <circle cx="53.5" cy="72" r="4.8" fill="#2A2118"/>
  <circle cx="74.5" cy="72" r="4.8" fill="#2A2118"/>
  <circle cx="55.2" cy="70.2" r="1.6" fill="#FFFFFF"/>
  <circle cx="76.2" cy="70.2" r="1.6" fill="#FFFFFF"/>
  <path d="M 59 83 h 10 l -5 5.4 z" fill="#D4726A"/>
  <path d="M 64 89 q -4.5 5 -9 1.8 M 64 89 q 4.5 5 9 1.8"
        fill="none" stroke="#2A2118" stroke-width="2.6" stroke-linecap="round"/>
  <!-- the sprout he carries — the thing all of this is about. Sized so it is
       still a lime cue rather than a smudge when the badge is 32px. -->
  <rect x="90" y="90" width="21" height="19" rx="5" fill="#6FA83F"/>
  <path d="M 100.5 90 v -9" stroke="#6FA83F" stroke-width="3.4" stroke-linecap="round"/>
  <ellipse cx="94" cy="79.5" rx="7.5" ry="4.6" fill="#C3F73A" transform="rotate(-24 94 79.5)"/>
  <ellipse cx="107" cy="81.5" rx="7.5" ry="4.6" fill="#C3F73A" transform="rotate(24 107 81.5)"/>

  <text x="152" y="80" fill="#071013"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="54" font-weight="600" letter-spacing="-0.5">trakkit</text>
  <rect x="153" y="92" width="143" height="4" rx="2" fill="#071013" opacity="0.28"/>
  <circle cx="304" cy="94" r="6" fill="#C3F73A"/>
</svg>
