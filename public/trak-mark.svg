<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Trak">
  <!-- The same mark with no badge, for placing on a surface that already has a
       colour. Trak keeps his own outline here, because on an unknown ground
       the fur cannot rely on contrast the way it can on ink. -->
  <g transform="rotate(-11 52.5 60)">
    <rect x="45" y="19" width="15" height="41" rx="7.5" fill="#F6F1E7" stroke="#2A2118" stroke-width="3"/>
    <rect x="49" y="25" width="7" height="28" rx="3.5" fill="#F0B3AC"/>
  </g>
  <g transform="rotate(11 75.5 60)">
    <rect x="68" y="19" width="15" height="41" rx="7.5" fill="#F6F1E7" stroke="#2A2118" stroke-width="3"/>
    <rect x="72" y="25" width="7" height="28" rx="3.5" fill="#F0B3AC"/>
  </g>
  <circle cx="64" cy="76" r="30" fill="#F6F1E7" stroke="#2A2118" stroke-width="3"/>
  <circle cx="53.5" cy="72" r="4.8" fill="#2A2118"/>
  <circle cx="74.5" cy="72" r="4.8" fill="#2A2118"/>
  <circle cx="55.2" cy="70.2" r="1.6" fill="#FFFFFF"/>
  <circle cx="76.2" cy="70.2" r="1.6" fill="#FFFFFF"/>
  <path d="M 59 83 h 10 l -5 5.4 z" fill="#D4726A" stroke="#2A2118" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M 64 89 q -4.5 5 -9 1.8 M 64 89 q 4.5 5 9 1.8"
        fill="none" stroke="#2A2118" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="90" y="90" width="21" height="19" rx="5" fill="#6FA83F" stroke="#2A2118" stroke-width="2.4"/>
  <path d="M 100.5 90 v -9" stroke="#4E7C2A" stroke-width="3.4" stroke-linecap="round"/>
  <ellipse cx="94" cy="79.5" rx="7.5" ry="4.6" fill="#8FCB4A" stroke="#2A2118" stroke-width="1.8" transform="rotate(-24 94 79.5)"/>
  <ellipse cx="107" cy="81.5" rx="7.5" ry="4.6" fill="#8FCB4A" stroke="#2A2118" stroke-width="1.8" transform="rotate(24 107 81.5)"/>
</svg>
